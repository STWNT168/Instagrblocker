<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 220px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 12px;
      color: #38bdf8;
    }
    .toggle-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    label {
      font-size: 13px;
    }
    input[type="checkbox"] {
      accent-color: #38bdf8;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Focus Settings</h2>
  
  <div class="toggle-group">
    <label for="blockAll">Block Entire Site</label>
    <input type="checkbox" id="blockAll">
  </div>
  
  <div class="toggle-group">
    <label for="hideReels">Hide Reels & Feed</label>
    <input type="checkbox" id="hideReels" checked>
  </div>

  <script>
    const blockAll = document.getElementById('blockAll');
    const hideReels = document.getElementById('hideReels');

    // Load saved settings
    chrome.storage.sync.get(['blockAll', 'hideReels'], (data) => {
      blockAll.checked = data.blockAll || false;
      hideReels.checked = data.hideReels !== false;
    });

    // Save on toggle
    blockAll.addEventListener('change', () => {
      chrome.storage.sync.set({ blockAll: blockAll.checked });
      chrome.tabs.query({active: true, currentWindow: true}, (tabs) => {
        if(tabs[0]) chrome.tabs.reload(tabs[0].id);
      });
    });

    hideReels.addEventListener('change', () => {
      chrome.storage.sync.set({ hideReels: hideReels.checked });
      chrome.tabs.query({active: true, currentWindow: true}, (tabs) => {
        if(tabs[0]) chrome.tabs.reload(tabs[0].id);
      });
    });
  </script>
</body>
</html>
